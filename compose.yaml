services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: poll
      POSTGRES_PASSWORD: poll
      POSTGRES_DB: poll
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poll -d poll"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://poll:poll@postgres:5432/poll?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://poll:poll@postgres:5432/poll?sslmode=disable
      REDIS_ADDR: redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token-change-me}
      COOKIE_SIGNING_KEY: ${COOKIE_SIGNING_KEY:-local-cookie-signing-key-32-bytes-change-me}
      DEDUP_HMAC_KEY: ${DEDUP_HMAC_KEY:-local-dedup-hmac-key-32-bytes-change-this}
      COOKIE_SECURE: "false"
      VOTE_BUCKETS: ${VOTE_BUCKETS:-64}
      REDIS_RETENTION: 24h
      SNAPSHOT_INTERVAL: 5s
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100000}
      LOG_LEVEL: info
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.20.8
    environment:
      URL: /openapi/openapi.yaml
    volumes:
      - ./api/openapi.yaml:/openapi/openapi.yaml:ro
      - ./deploy/swagger/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
